<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Product Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: { brand: { 500: '#ff6b00', 600: '#e65100' }, dark: { bg: '#050505', card: '#121212', border: '#262626' } }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #e5e7eb; }
        .input-field { width: 100%; background: #1a1a1a; border: 1px solid #333; padding: 10px; border-radius: 8px; color: white; outline: none; margin-bottom: 10px; }
        .input-field:focus { border-color: #ff6b00; }
        .btn-primary { background: #ff6b00; color: white; padding: 10px 20px; border-radius: 8px; font-weight: bold; width: 100%; transition: 0.3s; cursor: pointer; }
        .btn-primary:hover { background: #e65100; }
        .btn-disabled { background: #555; cursor: not-allowed; opacity: 0.6; }
        .upload-box { border: 2px dashed #333; padding: 20px; text-align: center; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .upload-box:hover { border-color: #ff6b00; background: rgba(255, 107, 0, 0.05); }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 z-[60] flex items-center justify-center bg-black">
        <div class="bg-dark-card p-8 rounded-2xl border border-dark-border w-96 shadow-2xl text-center">
            <h1 class="text-3xl font-bold mb-6 text-white">Admin Login</h1>
            <input type="email" id="admin-email" placeholder="Email" class="input-field">
            <input type="password" id="admin-pass" placeholder="Password" class="input-field">
            <button id="btn-login" class="btn-primary mt-4 w-full">Login</button>
        </div>
    </div>

    <!-- SIDEBAR -->
    <aside class="w-64 bg-dark-card border-r border-dark-border flex-col hidden md:flex">
        <div class="h-16 flex items-center px-6 border-b border-dark-border">
            <span class="text-xl font-bold text-white">Product<span class="text-brand-500">Hub</span></span>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button id="nav-products" class="w-full text-left px-4 py-3 rounded-lg hover:bg-white/5 text-gray-300 flex items-center gap-3">
                <i class="fas fa-box text-brand-500"></i> Manage Products
            </button>
            <button id="nav-orders" class="w-full text-left px-4 py-3 rounded-lg hover:bg-white/5 text-gray-300 flex items-center gap-3">
                <i class="fas fa-shopping-cart text-brand-500"></i> Manage Orders
            </button>
        </nav>
        <div class="p-4 border-t border-dark-border">
            <button id="btn-logout" class="w-full text-left px-4 py-2 text-red-500 hover:bg-white/5 rounded-lg border border-red-500/20">Logout</button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="h-16 bg-dark-card border-b border-dark-border flex items-center justify-between px-6">
            <h2 id="page-title" class="text-xl font-bold">Dashboard</h2>
            <div class="text-sm text-gray-400 font-mono" id="admin-user-display">Not Logged In</div>
        </header>

        <div id="app" class="flex-1 overflow-y-auto p-8 bg-dark-bg">
            <!-- PRODUCTS VIEW -->
            <div id="view-products" class="hidden space-y-6">
                <div class="flex justify-between items-center">
                    <h3 class="text-2xl font-bold text-white">Product Inventory</h3>
                    <button id="btn-open-add-modal" class="bg-brand-500 hover:bg-brand-600 text-white px-6 py-2 rounded-lg font-bold shadow-lg shadow-brand-500/20 transition">
                        + Add New Product
                    </button>
                </div>
                <div class="bg-dark-card rounded-xl border border-dark-border overflow-hidden">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="bg-white/5 border-b border-dark-border">
                                <th class="p-4">Image</th>
                                <th class="p-4">Name</th>
                                <th class="p-4">Price</th>
                                <th class="p-4">Status</th>
                                <th class="p-4">Action</th>
                            </tr>
                        </thead>
                        <tbody id="product-list-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- ORDERS VIEW -->
            <div id="view-orders" class="hidden space-y-6">
                <h3 class="text-2xl font-bold text-white">Customer Orders</h3>
                <div class="bg-dark-card rounded-xl border border-dark-border overflow-hidden">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="bg-white/5 border-b border-dark-border">
                                <th class="p-4">ID</th>
                                <th class="p-4">Item</th>
                                <th class="p-4">Payment</th>
                                <th class="p-4">Status</th>
                                <th class="p-4">Update</th>
                            </tr>
                        </thead>
                        <tbody id="order-list-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL: ADD PRODUCT -->
    <div id="add-product-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/90 backdrop-blur-sm p-4">
        <div class="bg-dark-card p-6 rounded-2xl border border-dark-border w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl relative">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-white">Add New Product</h3>
                <button id="btn-close-modal" class="text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            
            <!-- IMAGE SELECT (Local Preview Only) -->
            <div class="mb-4">
                <label class="text-xs text-gray-400 uppercase font-bold mb-2 block">Product Image *</label>
                <div class="upload-box" id="upload-box-click">
                    <input type="file" id="img-file-input" class="hidden" accept="image/*">
                    <div id="upload-placeholder">
                        <i class="fas fa-cloud-upload-alt text-3xl text-brand-500 mb-2"></i>
                        <p class="text-sm text-gray-300">Click to Select Image</p>
                    </div>
                    <img id="preview-img" class="hidden w-full h-40 object-contain rounded mt-2">
                </div>
            </div>

            <input type="text" id="p-name" placeholder="Product Name *" class="input-field">
            <textarea id="p-desc" placeholder="Product Description" rows="3" class="input-field"></textarea>
            
            <div class="grid grid-cols-3 gap-3">
                <input type="number" id="p-mrp" placeholder="MRP" class="input-field">
                <input type="number" id="p-price" placeholder="Sell Price" class="input-field">
                <input type="number" id="p-upi" placeholder="UPI Price" class="input-field border-brand-500/50">
            </div>

            <div class="flex gap-6 mb-6 mt-2">
                <label class="flex items-center gap-2"><input type="checkbox" id="p-active" checked> Active</label>
                <label class="flex items-center gap-2"><input type="checkbox" id="p-return" checked> Returnable</label>
            </div>

            <!-- SAVE BUTTON (Triggers Upload Then Save) -->
            <button id="btn-save-publish" class="btn-primary w-full">Save & Publish</button>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-5 right-5 bg-dark-card border border-brand-500 text-white px-6 py-4 rounded-lg shadow-2xl opacity-0 translate-y-10 transition-all duration-300 z-[100]">
        Notification
    </div>

    <!-- MODULE SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, doc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // CONFIG
        const firebaseConfig = {
          apiKey: "AIzaSyCNzC9ktPg35HFI7Ysug00UGbxpyPF4CWc",
          authDomain: "product-hub-2460f.firebaseapp.com",
          databaseURL: "https://product-hub-2460f-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "product-hub-2460f",
          storageBucket: "product-hub-2460f.firebasestorage.app",
          messagingSenderId: "25625286602",
          appId: "1:25625286602:web:5d660edd5f3dc7d86ce133"
        };
        const IMGBB_API_KEY = "e2e1a14ef34ed25e0344727a71f65a6d";

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            console.log("Firebase Connected");
        } catch(e) { console.error("Firebase Error", e); }

        let selectedImageFile = null;

        // ===========================================
        // EVENT LISTENERS (Replaces onclick)
        // ===========================================
        document.addEventListener('DOMContentLoaded', () => {
            
            // Login
            document.getElementById('btn-login').addEventListener('click', handleLogin);
            
            // Logout
            document.getElementById('btn-logout').addEventListener('click', handleLogout);

            // Navigation
            document.getElementById('nav-products').addEventListener('click', () => switchView('products'));
            document.getElementById('nav-orders').addEventListener('click', () => switchView('orders'));

            // Modal Controls
            document.getElementById('btn-open-add-modal').addEventListener('click', () => {
                resetModal();
                document.getElementById('add-product-modal').classList.remove('hidden');
            });
            document.getElementById('btn-close-modal').addEventListener('click', () => {
                document.getElementById('add-product-modal').classList.add('hidden');
            });

            // Image Selection (Preview Only)
            document.getElementById('upload-box-click').addEventListener('click', () => {
                document.getElementById('img-file-input').click();
            });
            document.getElementById('img-file-input').addEventListener('change', handleFileSelect);

            // SAVE & PUBLISH (The Main Logic)
            document.getElementById('btn-save-publish').addEventListener('click', handleSaveAndPublish);
        });

        // ===========================================
        // LOGIC FUNCTIONS
        // ===========================================

        // 1. Auth Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-user-display').innerText = user.email;
                switchView('products');
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
            }
        });

        async function handleLogin() {
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-pass').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                showToast("Login Successful");
            } catch(e) { alert("Login Failed: " + e.message); }
        }

        async function handleLogout() {
            await signOut(auth);
            window.location.reload();
        }

        // 2. Image Selection (No Upload Yet)
        function handleFileSelect(e) {
            if (e.target.files && e.target.files[0]) {
                selectedImageFile = e.target.files[0];
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const preview = document.getElementById('preview-img');
                    preview.src = evt.target.result;
                    preview.classList.remove('hidden');
                    document.getElementById('upload-placeholder').classList.add('hidden');
                };
                reader.readAsDataURL(selectedImageFile);
            }
        }

        // 3. Save & Publish (Upload -> Then Save)
        async function handleSaveAndPublish() {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const btn = document.getElementById('btn-save-publish');

            if (!name || !price) return alert("Product Name and Sell Price are required!");
            if (!selectedImageFile) return alert("Please select a product image!");

            try {
                // UI: Loading
                btn.innerText = "Uploading Image...";
                btn.disabled = true;
                btn.classList.add('btn-disabled');

                // Step A: Upload Image to ImgBB
                const formData = new FormData();
                formData.append("image", selectedImageFile);
                
                const imgRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                });
                const imgData = await imgRes.json();

                if (!imgData.success) throw new Error("Image Upload Failed");
                const imageUrl = imgData.data.url;

                // UI: Saving to DB
                btn.innerText = "Saving Product...";

                // Step B: Save to Firestore
                const productData = {
                    name: name,
                    description: document.getElementById('p-desc').value,
                    mrp: Number(document.getElementById('p-mrp').value),
                    discountPrice: Number(price),
                    upiDiscountPrice: Number(document.getElementById('p-upi').value),
                    images: [imageUrl], // The URL from ImgBB
                    active: document.getElementById('p-active').checked,
                    returnable: document.getElementById('p-return').checked,
                    createdAt: new Date().toISOString()
                };

                await addDoc(collection(db, "products"), productData);
                
                showToast("Product Published Successfully!");
                document.getElementById('add-product-modal').classList.add('hidden');
                loadProducts();

            } catch (error) {
                console.error(error);
                alert("Error: " + error.message);
            } finally {
                btn.innerText = "Save & Publish";
                btn.disabled = false;
                btn.classList.remove('btn-disabled');
            }
        }

        // 4. View Switcher
        function switchView(view) {
            document.getElementById('view-products').classList.add('hidden');
            document.getElementById('view-orders').classList.add('hidden');
            document.getElementById(`view-${view}`).classList.remove('hidden');
            document.getElementById('page-title').innerText = view === 'products' ? 'Manage Products' : 'Manage Orders';
            
            if(view === 'products') loadProducts();
            if(view === 'orders') loadOrders();
        }

        // 5. Load Products
        async function loadProducts() {
            const tbody = document.getElementById('product-list-body');
            tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-500">Loading...</td></tr>';
            try {
                const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
                const snap = await getDocs(q);
                if(snap.empty) {
                    tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-500">No products found.</td></tr>';
                    return;
                }
                tbody.innerHTML = '';
                snap.forEach(doc => {
                    const p = doc.data();
                    const row = document.createElement('tr');
                    row.className = "border-b border-dark-border hover:bg-white/5 transition";
                    row.innerHTML = `
                        <td class="p-3"><img src="${p.images?.[0]}" class="w-12 h-12 rounded bg-gray-800 object-cover"></td>
                        <td class="p-3 font-medium text-white">${p.name}</td>
                        <td class="p-3 text-sm text-gray-300">₹${p.discountPrice}</td>
                        <td class="p-3"><span class="px-2 py-1 rounded text-xs ${p.active ? 'bg-green-500/20 text-green-500' : 'bg-red-500/20 text-red-500'}">${p.active ? 'Active' : 'Hidden'}</span></td>
                        <td class="p-3"><button class="text-red-500 hover:text-white p-2 delete-btn" data-id="${doc.id}"><i class="fas fa-trash"></i></button></td>
                    `;
                    tbody.appendChild(row);
                });

                // Attach Delete Listeners
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => handleDelete(e.currentTarget.dataset.id));
                });

            } catch(e) { console.error(e); }
        }

        async function handleDelete(id) {
            if(confirm("Delete this product?")) {
                await deleteDoc(doc(db, "products", id));
                showToast("Deleted");
                loadProducts();
            }
        }

        // 6. Load Orders
        async function loadOrders() {
            const tbody = document.getElementById('order-list-body');
            tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-500">Loading...</td></tr>';
            try {
                const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
                const snap = await getDocs(q);
                if(snap.empty) {
                    tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-500">No orders yet.</td></tr>';
                    return;
                }
                tbody.innerHTML = '';
                snap.forEach(docSnap => {
                    const o = docSnap.data();
                    const statusColor = o.status.includes('Pending') ? 'text-yellow-500' : (o.status === 'Confirmed' ? 'text-blue-500' : 'text-green-500');
                    const row = document.createElement('tr');
                    row.className = "border-b border-dark-border hover:bg-white/5 transition";
                    row.innerHTML = `
                        <td class="p-3 text-xs text-gray-400">#${docSnap.id.substring(0,6)}</td>
                        <td class="p-3"><div class="font-bold text-sm text-white">${o.item.name}</div></td>
                        <td class="p-3 text-sm text-gray-300">₹${o.total} <span class="text-xs uppercase bg-gray-800 px-1">${o.method}</span></td>
                        <td class="p-3 font-bold text-sm ${statusColor}">${o.status}</td>
                        <td class="p-3">
                            <select class="bg-black border border-gray-700 text-xs rounded p-2 outline-none status-select" data-id="${docSnap.id}">
                                <option disabled selected>Update</option>
                                <option value="Confirmed">Confirm</option>
                                <option value="Shipped">Shipped</option>
                                <option value="Delivered">Delivered</option>
                                <option value="Cancelled">Cancel</option>
                            </select>
                        </td>
                    `;
                    tbody.appendChild(row);
                });

                // Attach Status Change Listeners
                document.querySelectorAll('.status-select').forEach(sel => {
                    sel.addEventListener('change', (e) => handleStatusUpdate(e.target.dataset.id, e.target.value));
                });

            } catch(e) { console.error(e); }
        }

        async function handleStatusUpdate(id, status) {
            try {
                let msg = "Status updated to " + status;
                if(status === 'Shipped') msg = "Your order is on the way!";
                await updateDoc(doc(db, "orders", id), { status: status, trackingMsg: msg });
                showToast("Order Updated");
                loadOrders();
            } catch(e) { alert("Error: " + e.message); }
        }

        // Helper: Reset Modal
        function resetModal() {
            document.getElementById('p-name').value = '';
            document.getElementById('p-desc').value = '';
            document.getElementById('p-mrp').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-upi').value = '';
            selectedImageFile = null;
            document.getElementById('preview-img').classList.add('hidden');
            document.getElementById('upload-placeholder').classList.remove('hidden');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('opacity-0', 'translate-y-10');
            setTimeout(() => t.classList.add('opacity-0', 'translate-y-10'), 3000);
        }
    </script>
</body>
</html>
