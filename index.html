<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<title>Admin Panel – Product Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js" type="module"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js" type="module"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js" type="module"></script>
<style>
body{background:#050505;color:#e5e7eb;font-family:Inter,system-ui}
.input{width:100%;padding:10px;background:#111;border:1px solid #333;border-radius:8px;color:#fff}
.btn{background:#ff6b00;color:#fff;padding:10px;border-radius:8px;width:100%;font-weight:600}
.btn:disabled{opacity:.6}
</style>
</head>
<body class="p-6">

<h1 class="text-2xl font-bold mb-4">Admin Product Panel</h1>

<div class="bg-[#111] p-4 rounded-xl max-w-lg">
<input id="name" class="input mb-2" placeholder="Product Name" />
<input id="price" class="input mb-2" placeholder="Price" type="number" />
<input id="mrp" class="input mb-2" placeholder="MRP" type="number" />
<label class="flex gap-2 text-sm mb-2"><input type="checkbox" id="active" checked /> Active</label>
<label class="flex gap-2 text-sm mb-4"><input type="checkbox" id="returnable" checked /> Return Allowed</label>
<input id="img" type="file" accept="image/*" class="mb-4" />
<button id="save" class="btn">Save Product</button>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js'
import { getAuth,onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js'
import { getFirestore,collection,addDoc,serverTimestamp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js'

const firebaseConfig={
 apiKey:"YOUR_API_KEY",
 authDomain:"YOUR_DOMAIN",
 projectId:"YOUR_PROJECT_ID"
}

const IMGBB_KEY='YOUR_IMGBB_KEY'

const app=initializeApp(firebaseConfig)
const auth=getAuth(app)
const db=getFirestore(app)

onAuthStateChanged(auth,u=>{if(!u)location.href='login.html'})

const btn=document.getElementById('save')

btn.onclick=async()=>{
 const name=nameEl.value.trim()
 if(!name||!img.files[0]) return alert('Missing data')
 btn.disabled=true;btn.innerText='Uploading...'

 const fd=new FormData();fd.append('image',img.files[0])
 const res=await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`,{method:'POST',body:fd})
 const json=await res.json()
 if(!json.success){alert('Image failed');btn.disabled=false;return}

 await addDoc(collection(db,'products'),{
  name,
  price:+price.value,
  mrp:+mrp.value,
  images:[json.data.url],
  active:active.checked,
  returnable:returnable.checked,
  createdAt:serverTimestamp()
 })

 alert('Product Added Successfully')
 btn.disabled=false;btn.innerText='Save Product'
}

const nameEl=document.getElementById('name')
const price=document.getElementById('price')
const mrp=document.getElementById('mrp')
const img=document.getElementById('img')
const active=document.getElementById('active')
const returnable=document.getElementById('returnable')
</script>
</body>
</html>
